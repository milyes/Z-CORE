<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>IA22_BIN – HTML5_pyc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interface locale souveraine pour binaire IA (.pyc) – IA22_BIN HTML5.">
  <style>
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#05060A; color:#E5E7EB; }
    header { padding:20px 24px; border-bottom:1px solid #1F2933; background:radial-gradient(circle at top left,#1F2937 0,#05060A 55%); }
    h1 { margin:0; font-size:1.4rem; letter-spacing:.08em; text-transform:uppercase; }
    main { padding:20px 24px 32px; max-width:720px; margin:0 auto; }
    label { display:block; margin-bottom:6px; font-size:.85rem; color:#9CA3AF; text-transform:uppercase; letter-spacing:.12em; }
    input, textarea { width:100%; background:#020617; border:1px solid #1F2933; border-radius:6px; padding:8px 10px; color:#E5E7EB; font-size:.9rem; }
    button { margin-top:10px; padding:8px 14px; border-radius:999px; border:1px solid #1F2933; background:#0F172A; color:#E5E7EB; font-size:.85rem; text-transform:uppercase; letter-spacing:.12em; cursor:pointer; }
    button:hover { background:#111827; }
    pre { margin-top:14px; padding:10px 12px; background:#020617; border-radius:6px; border:1px solid #1F2933; font-size:.85rem; overflow-x:auto; }
    .note { margin-top:16px; font-size:.8rem; color:#6B7280; }
  </style>
</head>
<body>
  <header>
    <h1>IA22_BIN – Interface locale</h1>
  </header>
  <main>
    <section>
      <label for="ia-input">Entrée IA (payload)</label>
      <textarea id="ia-input" rows="4" placeholder='{"input": "texte ou features"}'></textarea>
      <button onclick="runIA()">Lancer binaire IA (.pyc)</button>
      <pre id="ia-output">En attente de réponse du binaire IA…</pre>
      <div class="note">
        Cette interface HTML5 est purement locale.  
        Le binaire IA (.pyc) doit être exposé par un service HTTP local (127.0.0.1) conforme à IA22_LOGIC.
      </div>
    </section>
  </main>
  <script>
    async function runIA() {
      const out = document.getElementById('ia-output');
      let payload;
      try {
        payload = JSON.parse(document.getElementById('ia-input').value || '{}');
      } catch (e) {
        out.textContent = 'Payload JSON invalide.';
        return;
      }
      try {
        const res = await fetch('http://127.0.0.1:8080/ia22_bin', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        out.textContent = text;
      } catch (e) {
        out.textContent = 'Impossible de joindre le binaire IA sur 127.0.0.1:8080/ia22_bin.\nVérifie que ton service IA22_BIN est lancé.';
      }
    }
  </script>
</body>
</html>
