    if len(text) > 200: return False
    # 1 seule phrase = pas plus d'un point d'interrogation / exclamation / point
    sentences = re.split(r'[.!?]+', text.strip())
    sentences = [s for s in sentences if s.strip()]
    return len(sentences) <= 1

    t = text.lower()

    }
